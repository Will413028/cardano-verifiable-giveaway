# Reverse proxy in front of the project Dolos (plan docs/plans/2026-10-18-hardening-and-backend.md step 9, PD8 A):
# Blockfrost read-only endpoint allowlist (BR-01), per-IP rate limit (BR-03), CORS origin list (BR-04) and no request
# content in logs (BR-05). Runbook, values and their derivation: docs/runbooks/dolos-proxy.md. Checked statically by
# tests/core.test.mjs and live, in front of the Dolos dev chain, by tools/devchain/rproxy-check.mjs.
# Written for nginx 1.30 (stock modules only). Lines marked DEPLOY change per environment; nothing else should.
# Relative paths resolve against the prefix given with `nginx -p`.

worker_processes 1;
# BR-05: nginx writes the client address and the request line (query included) into error-level messages, such as
# rate-limit rejections and upstream failures. Only crit and above are written.
error_log logs/error.log crit;
pid logs/nginx.pid;

events {
  worker_connections 4096;
}

http {
  server_tokens off;

  # BR-01 (regexes end in \z, not $: PCRE's $ also matches before a final newline, so /blocks/latest%0A would pass):
  # the read-only endpoints the verifier (packages/chain BlockfrostChain), the page's tip and the creation page
  # (Evolution BlockfrostProvider: protocol parameters, the wallet UTxO) read; preprod identifiers only. Everything else,
  # including /tx/submit (the wallet submits, BR-15), answers 404 here and never reaches Dolos. The value is the route
  # name written to the access log instead of the path, so the log holds no transaction, address or stake key.
  map $uri $route {
    default "";
    "~^/blocks/latest\z" blocks-latest;
    "~^/blocks/[0-9]+\z" blocks-height;
    "~^/txs/[0-9a-f]{64}\z" tx;
    "~^/txs/[0-9a-f]{64}/cbor\z" tx-cbor;
    "~^/txs/[0-9a-f]{64}/utxos\z" tx-utxos;
    "~^/txs/[0-9a-f]{64}/metadata\z" tx-metadata;
    "~^/accounts/stake_test1[02-9ac-hj-np-z]+/addresses\z" account-addresses;
    "~^/addresses/(addr_test1|addr_vkh1)[02-9ac-hj-np-z]+/transactions\z" address-transactions;
    "~^/epochs/latest/parameters\z" epoch-parameters;
  }

  # Query strings: only Blockfrost paging and ordering keys with plain values.
  map $args $args_ok {
    default 0;
    "" 1;
    "~^(count|page|order|from|to)=[0-9a-z:]+(&(count|page|order|from|to)=[0-9a-z:]+)*\z" 1;
  }

  # BR-04: browsers on the listed origins may read the answers; a page on any other origin is refused (403) before it
  # costs Dolos anything. Requests without Origin (not a cross-origin page) pass without CORS headers.
  map $http_origin $cors {
    default refused;
    "" none;
    "http://127.0.0.1:4320" allowed; # DEPLOY: the page's origin(s), one line each
  }
  map $cors $cors_origin {
    default "";
    allowed $http_origin;
  }
  map $cors $cors_methods {
    default "";
    allowed "GET, OPTIONS";
  }
  # Evolution's provider sends Content-Type on GET, which makes the browser preflight.
  map $cors $cors_headers {
    default "";
    allowed "Content-Type";
  }

  # BR-05: no client address, query, path parameter, header or body; only when, what kind, and how it ended.
  log_format giveaway '$time_iso8601 $request_method $route $status $body_bytes_sent $request_time';
  access_log logs/access.log giveaway;

  # BR-03: per client address. 30 r/s sustained; the first 300 requests above that rate are served without delay, the
  # next 50 queue and are delayed to the rate, and beyond that (more than 350 in excess) the answer is 429. One full verification of an identity with
  # n = 265 history rows is 276 sequential requests (plan step 8b) and runs undelayed; a larger history is paced, not
  # refused, because a sequential client never holds more than one request in the queue. Derivation in the runbook.
  # The address lives only in this shared-memory zone, never on disk.
  limit_req_zone $binary_remote_addr zone=dolos_ip:10m rate=30r/s;
  limit_req_status 429;
  limit_req_log_level info;

  upstream dolos {
    server 127.0.0.1:3010; # DEPLOY: Dolos MiniBF listen_address, kept on the loopback interface
    keepalive 8;
  }

  server {
    listen 127.0.0.1:3020; # DEPLOY: listen 443 ssl, with the certificate lines from the runbook

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods $cors_methods always;
    add_header Access-Control-Allow-Headers $cors_headers always;
    add_header Access-Control-Max-Age 600 always;
    add_header Vary Origin always;

    if ($cors = refused) {
      return 403;
    }
    if ($route = "") {
      return 404;
    }
    if ($request_method !~ ^(GET|OPTIONS)$) {
      return 405;
    }
    if ($args_ok = 0) {
      return 400;
    }
    if ($request_method = OPTIONS) {
      return 204;
    }

    location / {
      limit_req zone=dolos_ip burst=350 delay=300;

      # The normalized path that matched the allowlist is what Dolos receives, never the raw request URI.
      proxy_pass http://dolos$uri$is_args$args;
      proxy_http_version 1.1;
      proxy_pass_request_headers off;
      proxy_pass_request_body off;
      proxy_set_header Host $proxy_host;
      proxy_set_header Connection "";
      proxy_read_timeout 20s;
      # Dolos answers every origin (permissive_cors); the headers above replace its own.
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Expose-Headers;
      proxy_hide_header Access-Control-Max-Age;
      proxy_hide_header Vary;
    }
  }
}
